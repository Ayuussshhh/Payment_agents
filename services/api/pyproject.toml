[project]
name = "mandate-api"
version = "0.1.0"
description = "HTTP adapter for the Mandate Core Engine"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi[standard]==0.162.4",
    "mandate-core",
    "redis>=5.2",
]

[tool.uv.sources]
mandate-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mandate_api"]
