[project]
name = "mandate-core"
version = "0.8.0"
description = "Mandate Core Engine"
requires-python = ">=3.10,<3.11"
dependencies = [
    "alembic>=1.16,<1.21",
    "httpx>=0.28",
    "langgraph>=1.0,<2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0.36,<2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-packages = true

[tool.hatch.build.targets.wheel.sources]
"src" = ""
